name: check upstream release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/sync_upstream.py
      - name: Require a reviewed update when generated content changes
        run: git diff --exit-code -- UPSTREAM_VERSION UPSTREAM_COMMIT plugins/senzing-bootcamp
