name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_port.py
      - run: python3 -m compileall -q scripts plugins/senzing-bootcamp/scripts
      - run: python3 scripts/package_release.py
