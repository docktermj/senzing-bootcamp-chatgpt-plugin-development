  "output_root": "plugins/senzing-bootcamp",
  "rules": [
    {"id": "copy-mcp-config", "kind": "copy", "match": [".mcp.json"], "reason": "The Codex plugin uses the version-matched upstream MCP configuration."},
    {"id": "copy-docs", "kind": "copy", "match": ["docs/**"], "reason": "Upstream owns bootcamp runtime documentation."},
    {"id": "copy-hooks", "kind": "copy", "match": ["hooks/**"], "reason": "Lifecycle hooks are ported from the version-matched upstream release."},
    {"id": "copy-scripts", "kind": "copy", "match": ["scripts/**"], "reason": "Upstream owns bootcamp runtime helper scripts."},
    {"id": "copy-skills", "kind": "copy", "match": ["skills/**"], "reason": "Upstream owns curriculum skills and outcomes."},
    {
      "id": "ignore-claude-manifest",
      "kind": "ignore",
      "match": [".claude-plugin/**"],
      "reason": "Codex uses the generated .codex-plugin/plugin.json artifact below."
    },
    {
      "id": "ignore-claude-commands",
      "kind": "ignore",
      "match": ["commands/**"],
      "reason": "Claude command entry points are represented by Codex-native skills."
    }
  ],
  "text_transforms": [
    {
      "id": "local-example-version",
      "match": ["docs/examples/*.md"],
      "operations": [
        {"kind": "regex", "pattern": "^(\\*\\*Plugin version:\\*\\* )\\S+$", "replacement": "\\g<1>${RELEASE_VERSION}", "flags": "m"}
      ]
    },
    {
      "id": "onboarding-completed-run",
      "match": ["skills/bootcamp-onboarding/SKILL.md"],
      "operations": [
        {"kind": "literal", "old": "## Before anything else", "new": "## Codex completed-run guard\n\nBefore applying the shared session-start rule or the fresh/resume decision below, read the top-level `bootcamp_complete` preference. If it is true, follow `../start-bootcamp/SKILL.md` for completed projects and stop the normal onboarding path: do not offer an automatic resume, repeat graduation, clear the completion marker, or overwrite progress. Only an explicitly requested new run proceeds in a user-selected fresh directory. When completion is not set, continue the unchanged onboarding/preparation path below.\n\n## Before anything else"}
      ]
    },
    {
      "id": "session-start-lifecycle",
      "match": ["scripts/session-start.py"],
      "operations": [
        {"kind": "literal", "old": "import recap_checkpoint", "new": "import recap_checkpoint\nfrom bootcamp_state import active_progress"},
        {"kind": "literal", "old": "if recap_checkpoint.bootcamp_active():", "new": "if active_progress() is not None:"}
      ]
    },
    {
      "id": "global-host-language",
      "match": ["*.md", "*.py", "*.json"],
      "notice_on_change": "Adapted for Codex from the version-matched Senzing upstream release.",
      "operations": [
        {"kind": "literal", "old": "${CLAUDE_PLUGIN_ROOT}", "new": "<plugin-root>"},
        {"kind": "literal", "old": "CLAUDE_PLUGIN_ROOT", "new": "plugin-root path"},
        {"kind": "literal", "old": ".claude-plugin", "new": ".codex-plugin"},
        {"kind": "literal", "old": "Claude Code CLI", "new": "Codex CLI"},
        {"kind": "literal", "old": "Claude Desktop", "new": "Codex desktop app"},
        {"kind": "literal", "old": "the Claude web app", "new": "Codex cloud"},
        {"kind": "literal", "old": "a Claude IDE extension", "new": "the Codex IDE"},
        {"kind": "literal", "old": "your Claude IDE extension", "new": "the Codex IDE"},
        {"kind": "literal", "old": "Claude Code", "new": "Codex"},
        {"kind": "literal", "old": "Claude interface", "new": "Codex interface"},
        {"kind": "literal", "old": "Claude plugin", "new": "Codex plugin"},
        {"kind": "literal", "old": "Claude session", "new": "Codex task"},
        {"kind": "literal", "old": "Claude-interface", "new": "Codex-interface"},
        {"kind": "literal", "old": "Claude app", "new": "Codex app"},
        {"kind": "literal", "old": "Claude IDE extension", "new": "Codex IDE"},
        {"kind": "regex", "pattern": "\\bOpus 5(?:\\.\\d+)*\\b", "replacement": "a high-capability Codex model"},
        {"kind": "regex", "pattern": "\\bSonnet 5(?:\\.\\d+)*\\b", "replacement": "a balanced Codex model"},
        {"kind": "literal", "old": "Haiku 4.5", "new": "a fast Codex model"},
        {"kind": "regex", "pattern": "\\bFable 5(?:\\.\\d+)*\\b", "replacement": "the highest-capability available Codex model"},
        {"kind": "literal", "old": "`/model opus` + `/effort high`", "new": "a high-capability Codex model at high reasoning effort"},
        {"kind": "literal", "old": "`/model sonnet` + `/effort medium`", "new": "a balanced Codex model at medium reasoning effort"},
        {"kind": "literal", "old": "`/model sonnet` + `/effort high`", "new": "a balanced Codex model at high reasoning effort"},
        {"kind": "literal", "old": "`/model opus`", "new": "the model control"},
        {"kind": "literal", "old": "`/model sonnet`", "new": "the model control"},
        {"kind": "literal", "old": "the bootcamper's Claude", "new": "the bootcamper's Codex"},
        {"kind": "literal", "old": "This is the Claude-plugin port", "new": "This is the Codex-plugin port"},
        {"kind": "regex", "pattern": "e\\.g\\. \"claude-[^\"\\n]+ / high\"", "replacement": "e.g. \"configured Codex model / high\""}
      ]
    },
    {
      "id": "hooks-readme",
      "match": ["hooks/README.md"],
      "operations": [
        {"kind": "literal", "old": "| `UserPromptSubmit` | `scripts/feedback-capture.py`", "new": "| `UserPromptSubmit` | `scripts/socratic-controller.py` | to restore the active module on every answer and keep automatic work moving until the next Socratic question. |\n| `UserPromptSubmit` | `scripts/feedback-capture.py`"},
        {"kind": "literal", "old": "## Design notes", "new": "## Automatic continuation scope\n\nThe Codex controller, Stop hook, and automatic SessionStart resume share `scripts/bootcamp_state.py`: they require a valid progress object with a nonblank string `current_module` and stand down when the top-level `bootcamp_complete` preference is true. Missing, empty, malformed, non-object, and unrecorded progress do not invent an active module. The controller is still invoked on every prompt; invocation alone does not force bootcamp instructions into an inactive task. Explicit start/resume remains available through the `start-bootcamp` entry skill, with a fresh directory required for a separately requested new run after completion. These guards do not rewrite progress or preferences. Other hooks retain their documented write-safety, feedback, and recap-durability behavior.\n\n## Design notes"},
        {"kind": "literal", "old": "## Runtime prerequisites (per platform)", "new": "## Native Codex edit safety\n\nCodex sends native `apply_patch` edits as `tool_input.command`, including every add, update, delete, and move path. `Write|Edit` matches that tool through Codex aliases; it does not change the payload into `file_path`. The Codex-owned `write-gate.py` overlay checks every affected target against the resolved project directory, including symlink escapes, and blocks malformed or unsupported edit input explicitly. Legacy `Write`/`Edit` payloads with `tool_input.file_path` remain supported. The existing secret-pattern scan applies to both forms.\n\nThis hook is a guardrail for matched edits, not a replacement for host sandbox permissions or a complete shell/MCP write boundary. Direct-script tests do not establish that the host fired the trusted hook; verify actual native edits in the release's Codex-host dry run.\n\n## Runtime prerequisites (per platform)"},
        {"kind": "literal", "old": "Environment-variable substitution (`<plugin-root>`) is performed by Claude\nCode identically on all three platforms.", "new": "Codex substitutes `${PLUGIN_ROOT}` in each hook command on all three platforms."},
        {"kind": "literal", "old": "- **Hooks ship with the plugin.** There is no hook-install step (this replaces the\n  Kiro `install_hooks.py` / `.kiro/hooks/` workflow).", "new": "- **Hooks ship with the plugin.** Codex discovers `hooks/hooks.json` automatically; there is no hook-install step. Because bundled hooks are non-managed, the bootcamper must review and trust the current definitions before Codex runs them."},
        {"kind": "literal", "old": "Detection scans the whole\n  current turn and biases toward silence if the turn's text is not yet on disk, and the\n  block reason tells the model to repeat nothing it has already asked — so a false block\n  can never surface as a duplicate question.", "new": "Detection uses Codex's stable `last_assistant_message` Stop-hook field, and the block reason tells the model to repeat nothing it has already asked."},
        {"kind": "literal", "old": "question, and it biases toward silence when the transcript cannot be read\ndecisively — a missed nudge is far cheaper than a duplicated question.", "new": "question. It reads Codex's stable `last_assistant_message` field rather than parsing the unstable transcript format."},
        {"kind": "regex", "pattern": "A `claude-code-guide` investigation.*?finding is recorded here so it is not re-investigated\\.", "replacement": "The Codex interface controls tool-result rendering. The plugin cannot suppress that host-owned UI, so it minimizes administrative write frequency and uses concise commentary to keep the bootcamper informed.", "flags": "s"}
      ]
    },
    {
      "id": "ground-rules",
      "match": ["skills/bootcamp-onboarding/ground-rules.md"],
      "operations": [
        {"kind": "insert-before-first-heading", "unless_contains": "## Codex turn execution (mandatory)", "value": "\n## Codex turn execution (mandatory)\n\nRead and follow `../../docs/codex-interaction-contract.md` before executing a bootcamp step. Codex\ncommentary is intermediate progress, not a turn boundary. After status-only or other non-yielding\nwork, continue in the same turn until the next skill-defined `👉` question. Before every final\nresponse, perform that document's turn-close audit.\n"},
        {"kind": "literal", "old": "**Model/effort tuning.** Model/effort is a session-level choice the bootcamper controls with\n  `/model` and `/effort` (it persists for the session; per-skill frontmatter would not — see\n  `../../docs/model-selection.md`).", "new": "**Model/effort tuning.** Model and reasoning effort are host-level choices the bootcamper controls with the visible Codex controls (see `../../docs/model-selection.md`)."},
        {"kind": "literal", "old": "the plugin ships\n  skills, hooks and commands, none of which reach their interface.", "new": "the plugin ships skills, lifecycle hooks, scripts, and an MCP configuration, none of which reach their interface."},
        {"kind": "section", "start": "## Naming the Codex interface (INV-158)", "end": "## Visual deliverables (Senzing brand)", "replacement": "## Naming the Codex interface (INV-158)\n\nCall the desktop application the **Codex desktop app**, its coding workspace the **Codex IDE**,\nand the terminal client the **Codex CLI**. When the exact host is unknown, say **your Codex\ninterface**. Do not invent interface-specific commands or controls."},
        {"kind": "section", "start": "## Module start banners and transitions", "end": "## Closing questions", "replacement": "## Module start banners and transitions\n\n- **Never show a module number to the bootcamper (INV-079).** In *every* bootcamper-facing line — the module-start banner, the journey map, transition questions, and especially casual acknowledgments such as \"Great, moving on to …\" — refer to a module by its **name** (\"Discover the Business Problem\"), never its number (\"Module 1\"). Module numbers are internal only (skill directory names, prerequisites, section headings, `config/*` keys) and MUST NOT appear in anything the bootcamper reads. When acknowledging a transition, use the next module's **name** — the same name shown in the journey map and the \"…next module: {name}?\" question.\n- At every module start, BEFORE any module work: read progress, then show the module start\n  banner, a journey map (the **selected** modules — from `selected_modules` in\n  `config/bootcamp_preferences.yaml` — marked by position relative to `current_module`: ✅ for\n  modules already experienced, i.e. those before `current_module` in the list, including\n  apparatus-exempt Bootcamp preparation (never in `modules_completed`) and Module 0 (which, when it\n  runs, IS recorded in `modules_completed` — INV-092);\n  🔄 for the current module; ⬜ for upcoming), before/after\n  framing, and a brief numbered step overview. Never skip these - they orient the bootcamper.\n- **Module selection drives the journey map.** The bootcamp is a sequence of named modules chosen\n  in the **Bootcamp preparation** module (`../bootcamp-preparation/SKILL.md`): **Core** includes\n  every module in order; **Customized** includes the required modules plus whichever optional\n  modules the bootcamper chose. Required modules always run; a deselected optional module is a\n  requested skip (INV-014). The journey map shows exactly the selected modules, in order, by name —\n  not a fixed 1–7 range.\n- **Bootcamp preparation and Module 0 are lightweight setup/preamble modules.** The Bootcamp\n  preparation module (setup + module selection, always first) and the optional entity-resolution\n  concepts primer (`../module-00-entity-resolution-concepts/SKILL.md`, run **only when selected** —\n  its old skip/keep gate is retired; inclusion is driven by the Bootcamp preparation selection,\n  INV-078) do NOT run the module-start apparatus above (no journey map, no before/after, no step\n  overview, no bootcamper-facing end-of-module summary). Keep them lightweight. When Module 0 runs it\n  presents only its ENTITY RESOLUTION CONCEPTS banner, the MCP-sourced description, and its explore\n  gate. **Recap capture differs between the two:** Bootcamp preparation is fully exempt and is never\n  added to `modules_completed`; Module 0, when it runs, DOES append its own name-based recap section\n  and is added to `modules_completed` (INV-092), so it appears in the recap and is reconciled at\n  graduation (INV-085).\n- **Estimated time to complete (INV-096).** After the step overview and before the model/effort\n  prompt, add a short, honest, range-based estimate of how long the module will take — e.g.\n  \"⏱️ Roughly 15-30 minutes, depending on download/install speed.\" Always caveat that it varies\n  with workstation power, business-scenario complexity, data volume, and how much must be\n  downloaded/installed. When a meaningful estimate is not possible for a module, say so plainly\n  (\"hard to estimate for this module\") rather than inventing a number; keep it honest and\n  range-based, never a single precise figure. It is explanatory output: suppress it entirely under\n  the `minimal` verbosity preset and keep it to one line under `concise` (INV-011/INV-012). This\n  applies only to the numbered content modules that run this apparatus — the apparatus-exempt setup\n  modules (Bootcamp preparation, Module 0) show no estimate.\n- **Best-value model/effort prompt.** This is the authoritative comparison, stage table and\n  switch/confirmation procedure, including graduation (INV-063/069/137/138/236/300).\n  After the overview and estimate, surface the recommendation below. Setup stages are exempt.\n\n  **Unconditional guidance, optional change.** There is no `model_guidance` preference and no\n  guidance-mode question. Ignore stale preferences for it. Keeping one model throughout is valid.\n  This is the only host-level setting offered as a bootcamp question (INV-247); do not add\n  permission, auto-accept, plan-mode or other interface-setting gates.\n\n  **Resolve roles first:** use `../../docs/model-selection.md` to resolve each role to one\n  concrete available model using reliable current host information. Retain those resolved values;\n  never infer your current model from your identity or a name in a file. No time-sensitive model\n  name, price, context-window claim or invented host command belongs in this table.\n\n  **Compare model and effort separately against live settings**, using the most recent reliable\n  host information or explicit user report of the value actually selected. A bare \"yes\"/\"done\"\n  does not expose a hidden setting. A readable model is compared even when effort is unreadable,\n  and vice versa. **Only for an unreadable dial**, fall back to that dial's resolved recommendation\n  in the stage just completed. With no such evidence, disclose the unknown; do not invent a match,\n  mismatch or supported setting. Never compare recommendation to recommendation for a readable\n  dial: a flat sequence would hide the offer from a user actually running another model.\n\n  **Above the entire table is satisfied, per dial.** Reliably identified effort above every\n  `high` row, or a reliably identified model above every resolved recommendation, earns a\n  statement that staying higher is fine, not another downgrade offer at every stage. Never infer\n  capability order from names. An in-table high-to-medium step down still earns the same optional\n  choice as a step up; this exemption is not a blanket ban on step-down offers.\n\n  **No dial differs:** give a one-line statement naming the recommendation's model and effort\n  separately, ask no switch question, and continue automatic work to the next defined 👉.\n  Mention user-controlled changes can apply to later messages. An unavailable comparison is not\n  a claimed match.\n\n  **A dial differs:** name only the moving dial, including the answer hint. Pin the appropriate\n  question below, substituting the resolved value(s), `{stage}` (\"this module\" or \"graduation\"),\n  and `{step-down clause}` (empty unless a known in-table step down):\n\n  > 👉 **Would you like to switch to {model} at {effort} reasoning effort for {stage}?{step-down clause}** (Recommended for best value; reply no to keep your current model and effort.)\n\n  > 👉 **Would you like to switch to {model} for {stage}?{step-down clause}** (Recommended for best value; reply no to keep your current model.)\n\n  > 👉 **Would you like to switch to {effort} reasoning effort for {stage}?{step-down clause}** (Recommended for best value; reply no to keep your current effort.)\n\n  The pinned step-down clause is: \" This is a step down from your current {current}; it is about\n  resource use, not a capability the stage requires, so staying put is fine.\" Make no unsupported\n  price claim. An effort-only offer never tells the user to reset the model.\n  Name the known Codex interface's supported controls before the question when needed; use intent,\n  not invented labels or commands. The offer is this turn's only question; do not show Step 1 yet.\n\n  **On no:** acknowledge and execute the first step in the same reply turn, continuing through\n  non-yielding steps to the next skill-defined 👉. A privacy reminder/status is not a turn ending.\n\n  **On yes:** re-read reliable setting evidence before replying. The user may have acted already,\n  so the live setting, not the yes alone, decides these three branches:\n\n  1. **Not yet set or still unobservable:** give one short supported-control instruction naming\n     only the moving dial, then end on this pinned wait gate; do not start stage work yet:\n\n     > 👉 **Are you done modifying the model and effort?** (Reply yes once you've set your model and effort; reply no if you need more time.)\n\n     On confirmation, continue into the first step. On no/\"not yet\", acknowledge and wait for\n     their go-ahead without re-asking the gate (INV-006). A bare confirmation does not make a\n     hidden value observed.\n  2. **Already at the recommendation:** acknowledge the actual setting and continue in the same\n     turn, with no confirmation gate. Nothing remains to confirm.\n  3. **Already deliberately set to another value:** name what is in force, honor it and continue\n     in the same turn without re-instructing the recommendation or adding a confirmation gate.\n     Running higher is fine; a recommended floor is not a ceiling.\n\n  Branches 2 and 3 skip the done gate; branch 1 keeps it. Only the bootcamper can change settings.\n  Never confuse an accepted offer with a performed switch or repeat a settled confirmation.\n\n  **One row per stage, in journey order.** This is the authoritative table; the host adaptation\n  resolves its roles and must not maintain a second table. Each row has one model and effort role.\n\n  | Stage | Model role | Reasoning effort |\n  |---|---|---|\n  | Onboarding | balanced | medium |\n  | Bootcamp preparation | balanced | medium |\n  | Entity Resolution Concepts | balanced | medium |\n  | Discover the Business Problem | balanced | medium |\n  | SDK setup | high-capability | high |\n  | System verification | balanced | high |\n  | Truth Set visualization | high-capability | high |\n  | Data collection | balanced | medium |\n  | Data Quality, Mapping, and Transformation | high-capability | high |\n  | Data processing | high-capability | high |\n  | Query, Visualize and Discover | high-capability | high |\n  | Bootcamp graduation | high-capability | high |\n\n  The first three rows are comparison-only: apparatus-exempt setup stages never present the\n  nudge (INV-075/078). From Data Quality, Mapping, and Transformation onward recommendations are\n  flat, so a user already there receives no new offer. Effort targets are floors, not ceilings.\n\n- **Module start banner:** name only the module, never its internal number:\n\n  ```text\n  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n  🚀🚀🚀  MODULE: [MODULE NAME IN CAPS]  🚀🚀🚀\n  ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n  ```\n\n- After an affirmative transition, run the next selected module's apparatus immediately.\n  Its comparison decides whether to end on the switch offer or continue into the first step.\n  Follow the three reply branches above rather than always asking the done gate. Checkpoint\n  completed work only, preserve the selected sequence, and end on the next defined question.\n"}
      ]
    },
    {
      "id": "graduation",
      "match": ["skills/graduation/SKILL.md"],
      "operations": [
        {"kind": "section", "start": "## Best-value model/effort prompt", "end": "## Pre-checks", "replacement": "## Best-value model/effort prompt\n\nAfter the preface and before Pre-checks, follow the **Best-value model/effort prompt** in\n`../bootcamp-onboarding/ground-rules.md` in full. Use its **Bootcamp graduation** table row and\nsubstitute **graduation** for `{stage}` in its pinned question.\n`../../docs/model-selection.md` supplies only Codex controls and model-role resolution.\n\nGuidance is unconditional; switching remains optional. Do not read a `model_guidance` preference\nor offer it only \"when helpful\". Compare live model and effort separately, using the canonical\nper-dial fallback and above-table exemption. Query, Visualize and Discover shares this row:\na user already there gets a statement, not a pointless offer.\n\nThe switch is the turn's only question. On decline, continue into Pre-checks in the same turn.\nOn acceptance, re-read actual setting evidence and follow the canonical three branches:\nnot yet set/unobservable ends on its pinned done gate; already recommended or deliberately\ndifferent continues without that gate. Only the bootcamper changes settings. After a needed\nconfirmation, run Pre-checks and the first step, continuing to the next defined question or\nthe terminal graduation banner under the interaction contract."}
      ]
    },
    {
      "id": "onboarding-flow",
      "match": ["skills/bootcamp-onboarding/onboarding-flow.md"],
      "operations": [
