      {"id":"INV-114","mechanism":"The ground-rules transformation preserves the canonical stage table, setup exemptions, independent live-dial comparison, pinned native switch/done gates and answer branches. Graduation delegates to it; port/overlay/docs/model-selection.md resolves host-supported roles without fixed model IDs. scripts.test_model_guidance guards these constructions; actual host interaction remains a manual check."},
