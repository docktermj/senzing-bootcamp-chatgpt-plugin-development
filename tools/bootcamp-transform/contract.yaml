    "source_commit": "d3d99523f88957cd9dda2d29375892bf2c557663",
    "review": "docs/parent-0.6.1-review.md",
    "scope": "Honor runtime guarantees through the tagged plugin and explicit Codex restatements. Parent-development-only subjects retain their source scope; importing the participant plugin does not transplant the parent's unshipped maintainer environment or claim its private tests ran here.",
    "honored": "all upstream INV-NNN identifiers except entries explicitly preserved_restated or discounted",
    "preserved_restated": [
