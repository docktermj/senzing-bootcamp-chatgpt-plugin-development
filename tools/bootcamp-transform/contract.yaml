      {"id":"INV-138","mechanism":"The ground-rules transformation preserves the canonical stage table, setup exemptions, independent live-dial comparison, pinned native switch/done gates and answer branches. Graduation delegates to it; port/overlay/docs/model-selection.md resolves host-supported roles without fixed model IDs. scripts.test_model_guidance guards these constructions; actual host interaction remains a manual check."},
      {"id":"INV-139","mechanism":"The ground-rules transformation preserves the canonical stage table, setup exemptions, independent live-dial comparison, pinned native switch/done gates and answer branches. Graduation delegates to it; port/overlay/docs/model-selection.md resolves host-supported roles without fixed model IDs. scripts.test_model_guidance guards these constructions; actual host interaction remains a manual check."},
      {"id":"INV-140","mechanism":"The ground-rules transformation preserves the canonical stage table, setup exemptions, independent live-dial comparison, pinned native switch/done gates and answer branches. Graduation delegates to it; port/overlay/docs/model-selection.md resolves host-supported roles without fixed model IDs. scripts.test_model_guidance guards these constructions; actual host interaction remains a manual check."},
      {"id":"INV-141","mechanism":"The ground-rules transformation preserves the canonical stage table, setup exemptions, independent live-dial comparison, pinned native switch/done gates and answer branches. Graduation delegates to it; port/overlay/docs/model-selection.md resolves host-supported roles without fixed model IDs. scripts.test_model_guidance guards these constructions; actual host interaction remains a manual check."},
      {"id":"INV-236","mechanism":"The ground-rules transformation preserves the canonical stage table, setup exemptions, independent live-dial comparison, pinned native switch/done gates and answer branches. Graduation delegates to it; port/overlay/docs/model-selection.md resolves host-supported roles without fixed model IDs. scripts.test_model_guidance guards these constructions; actual host interaction remains a manual check."}
    ],
    "discounted": []
